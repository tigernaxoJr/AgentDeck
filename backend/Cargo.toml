[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = "0.3"
ai-cli = { path = "crates/ai-cli", features = ["mock"] }

[profile.release]
opt-level = "z"     # 優化二進制體積 (Optimize for size)
lto = true           # 啟用 Link-Time Optimization 消除跨 crate 未使用代碼
codegen-units = 1    # 減少 code generation units 換取最大 LTO 優化
panic = "abort"      # 移除 unwinding landing pads 減少代碼體積
strip = true         # 自動 strip 符號表與調試資訊 (相當於 strip symbols)
